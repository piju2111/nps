<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's ETF Recommendation (Accessible)</title>
  <!-- PapaParse for CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 34px;
      font-weight: 900;
      color: #ffffff;
      margin: 0;
      letter-spacing: 0.5px;
    }
    .card {
      background: #161b26;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
      border: 2px solid #30363d;
    }
    .highlight-card {
      border: 4px solid #388bfd;
      background: #121d2f;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 10px 20px;
      font-size: 20px;
      font-weight: 800;
      border-radius: 30px;
      background: #1f6feb;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .ticker {
      font-size: 64px;
      font-weight: 900;
      color: #ffd700; /* High-contrast golden yellow */
      margin: 16px 0 10px 0;
      line-height: 1.1;
      word-break: break-word;
    }
    .details {
      font-size: 26px;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 12px;
    }
    .price {
      font-size: 34px;
      font-weight: 800;
      color: #58a6ff;
      margin-bottom: 20px;
    }
    .speaker-btn {
      background: #238636; /* High-contrast accessible green */
      color: #ffffff;
      border: 3px solid #3fb950;
      border-radius: 50px;
      padding: 18px 36px;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
      margin: 8px auto 0 auto;
    }
    .speaker-btn:active {
      background: #2ea043;
      transform: scale(0.98);
    }
    .table-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 18px;
      color: #ffffff;
      border-bottom: 2px solid #30363d;
      padding-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 16px 12px;
      text-align: left;
      font-size: 22px;
      border-bottom: 1px solid #30363d;
    }
    th {
      color: #8b949e;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .table-ticker {
      font-weight: 900;
      color: #ffd700;
      font-size: 24px;
    }
    .ab-score {
      font-weight: 800;
      color: #58a6ff;
    }
    .surge-badge {
      font-weight: 800;
      color: #3fb950;
    }
    .footer {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #8b949e;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Today's ETF Buying Signal</h1>
  </div>

  <!-- Primary Pick Card -->
  <div id="top-pick-card" class="card highlight-card">
    <div class="badge">#1 Ranked Buy Today</div>
    <div id="top-ticker" class="ticker">Scanning...</div>
    <div id="top-category" class="details">—</div>
    <div id="top-price" class="price">—</div>

    <button id="speak-btn" class="speaker-btn" onclick="speakAllTop5()">
      🔊 <span>Listen to Top 5</span>
    </button>
  </div>

  <!-- Accessible Table -->
  <div class="card">
    <div class="table-title">Top 5 Eligible ETFs</div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Ticker</th>
          <th>Price</th>
          <th>AB%</th>
          <th>Surge</th>
        </tr>
      </thead>
      <tbody id="ranked-list">
        <tr>
          <td colspan="5" style="text-align: center; padding: 30px; font-size: 22px;">Loading data...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="footer">
    Rules: Turnover > ₹1.00 Cr | Surge > 1.0 | Ascending AB%
  </div>
</div>

<script>
  // Clean, consistent base URL definition
  const BASE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRjjLROfZH15-ATOxhyE_LiprAfFl7yOxzPbfyryhdOhaQ6vEpJ-Q5b5DljHr3B0Ags8PxC8BYjC-fh/pub?gid=2034581734&single=true&output=csv";

  let voiceAnnouncementText = "Scanning is in progress. Please wait.";

  function cleanTickerPronunciation(symbol) {
    if (!symbol) return "";
    let s = symbol.trim().toUpperCase();

    const customMap = {
      "GROWWPOWER": "Grow Power",
      "GROWWHOSPI": "Grow Hospital",
      "GROWWRAIL": "Grow Railway",
      "GROWWEV": "Grow E V",
      "GROWWCHEM": "Grow Chemical",
      "GROWWDEFNC": "Grow Defence",
      "MODEFENCE": "Moti-lal Defence",
      "MOREALTY": "Moti-lal Realty",
      "MOCAPITAL": "Moti-lal Capital",
      "MON100": "Nasdaq 100",
      "MOTOUR": "Moti-lal Tourism",
      "MOVALUE": "Moti-lal Value",
      "QUAL30IETF": "Quality 30 ETF",
      "MOMENTUM50": "Momentum 50",
      "MOM30IETF": "Momentum 30 ETF",
      "LOWVOLIETF": "Low Volatility ETF",
      "INSUREIETF": "Insurance ETF",
      "PVTBANIETF": "Private Bank ETF",
      "PSUBNKBEES": "P S U Bank Bees",
      "HNGSNGBEES": "Hang Seng Bees",
      "CONSUMBEES": "Consumption Bees",
      "CPSEETF": "C P S E ETF",
      "BFSI": "B F S I",
      "OILIETF": "Oil ETF"
    };

    if (customMap[s]) return customMap[s];

    s = s.replace(/BEES$/, " Bees");
    s = s.replace(/IETF$/, " E T F");
    s = s.replace(/ETF$/, " E T F");
    s = s.replace(/^GROWW/, "Grow ");
    return s;
  }

  function cleanNumber(val) {
    if (!val) return 0;
    const num = parseFloat(val.toString().replace(/[₹,% ]/g, ""));
    return isNaN(num) ? 0 : num;
  }

  async function loadETFData() {
    try {
      // Dynamic timestamp guarantees a fresh, un-cached fetch on the first attempt
      const freshUrl = BASE_SHEET_CSV_URL + "&_t=" + new Date().getTime();

      Papa.parse(freshUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          processSheetRows(results.data);
        },
        error: function(err) {
          document.getElementById("top-ticker").innerText = "Error Loading";
          voiceAnnouncementText = "Error loading market data.";
          console.error(err);
        }
      });
    } catch (e) {
      console.error(e);
    }
  }

  function processSheetRows(rows) {
    const qualified = [];

    rows.forEach(row => {
      const symbol = (row["Symbol"] || "").trim();
      const category = (row["Category / Bucket"] || "").trim();
      const ltp = cleanNumber(row["Live Price (LTP)"]);
      const sma20TO = cleanNumber(row["SMA20 Turnover (₹ Cr)"]);
      const abScore = cleanNumber(row["Composite AB (%)"]);
      const surge = cleanNumber(row["Turnover Surge"] || row["Surge formula"]);

      // Core System Filter: Turnover >= 1.00 Cr, AB > 0, Surge > 1.0
      if (symbol && sma20TO >= 1.00 && abScore > 0 && surge > 1.00) {
        qualified.push({
          symbol,
          category,
          ltp,
          sma20TO,
          abScore,
          surge
        });
      }
    });

    // Ascending sort: lowest positive AB score first
    qualified.sort((a, b) => a.abScore - b.abScore);

    displayResults(qualified);
  }

  function displayResults(list) {
    if (list.length === 0) {
      document.getElementById("top-ticker").innerText = "NO BUY SIGNAL";
      document.getElementById("top-category").innerText = "No ETF cleared Turnover, AB, and Surge rules.";
      document.getElementById("top-price").innerText = "";
      document.getElementById("ranked-list").innerHTML = "<tr><td colspan='5' style='text-align: center; padding: 24px;'>No qualified ETFs found today.</td></tr>";
      voiceAnnouncementText = "Today there is no buy signal. No ETF qualified under portfolio rules.";
      return;
    }

    const top = list[0];
    document.getElementById("top-ticker").innerText = top.symbol;
    document.getElementById("top-category").innerText = `${top.category} (Surge: ${top.surge.toFixed(2)}x)`;
    document.getElementById("top-price").innerText = `Price: ₹${top.ltp.toFixed(2)}`;

    // Build the audio script
    const top5 = list.slice(0, 5);
    const spokenTopName = cleanTickerPronunciation(top.symbol);
    
    let speechParts = [`Today's top buy recommendation is ${spokenTopName} at ${Math.round(top.ltp)} rupees. Here are the top ranked ETFs. `];

    top5.forEach((item, index) => {
      const spokenName = cleanTickerPronunciation(item.symbol);
      speechParts.push(`Number ${index + 1}, ${spokenName}, price ${Math.round(item.ltp)} rupees. `);
    });

    voiceAnnouncementText = speechParts.join(" ");

    // Populate the table
    let tableHtml = "";
    top5.forEach((item, index) => {
      tableHtml += `
        <tr>
          <td><strong>#${index + 1}</strong></td>
          <td class="table-ticker">${item.symbol}</td>
          <td>₹${item.ltp.toFixed(2)}</td>
          <td class="ab-score">+${item.abScore.toFixed(2)}%</td>
          <td class="surge-badge">${item.surge.toFixed(2)}x</td>
        </tr>
      `;
    });

    document.getElementById("ranked-list").innerHTML = tableHtml;
  }

  function speakAllTop5() {
    if (!('speechSynthesis' in window)) {
      alert("Text-to-speech is not supported by your browser.");
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(voiceAnnouncementText);
    utterance.lang = 'en-IN';
    utterance.rate = 0.86;
    utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  }

  // Initial load on page open
  loadETFData();

  // Background auto-refresh every 5 minutes
  setInterval(loadETFData, 5 * 60 * 1000);
</script>

</body>
</html>
